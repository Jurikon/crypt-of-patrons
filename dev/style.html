<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Retro style test</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #050403;
        overflow: hidden;
        font-family: monospace;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        image-rendering: pixelated;
      }
      #ui {
        position: absolute;
        left: 10px;
        bottom: 10px;
        color: #d8c8a8;
        font-size: 12px;
        text-shadow: 1px 1px #000;
      }
      #hud {
        position: absolute;
        left: 18px;
        bottom: 36px;
        width: 220px;
      }
      .bar {
        height: 9px;
        margin-top: 4px;
        border: 2px solid #1a1410;
        background: #2a1a12;
      }
      .bar > div {
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="hud">
      <div class="bar"><div style="width: 72%; background: #b8241c"></div></div>
      <div class="bar"><div style="width: 90%; background: #3a9a3a"></div></div>
    </div>
    <div id="ui">1 / 2 / 3 — biome · Space — swing · drag — look · P — smooth / pixels</div>
    <script type="module" src="./style.ts"></script>
  </body>
</html>
